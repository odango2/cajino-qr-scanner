<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <title>QRスキャナー</title>

  <style>
    body {
      padding: 20px;
      font-family: sans-serif;
    }

    video {
      display: block;
      width: 100%;
      max-width: 500px;
      margin-top: 20px;
      background-color: #000;
    }

    #message{
      font-weight: bold;
      white-space: pre-wrap;
    }
    
  </style>
</head>

  <body>
    <h1>1S QRスキャナー</h1>

    <p 使用するカメラ></p>

    <select id="camera_select">
      <option value="">
        カメラを選択してください
      </option>
    </select>

    <button onclick="loadCameras()">
      カメラ一覧を取得
    </button>

    <button onclick="startCamera()">
      カメラを起動する
    </button>

    <button onclick="stopCamera()">
      カメラを停止
    </button>
    
    <p id="message">
      カメラは停止中です。
    </p>

    <video
      id="camera"
      autoplay
      playsinline
      muted
    ></video>

    <script>
      let cameraStream = null;

      async function startCamera()
      {
        const message = document.getElementById("message");

        const video = document.getElementById("camera");

        if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia)
        {
          message.textContent = "このブラウザではカメラ機能を使用できません";
          return;
        }

        /*
         * 二重起動防止
         */
        stopCamera();

        message.textContent = "カメラを起動しています...";

        try
        {
          const selectedDeviceId = document.getElementById("camera_select").value;

          if(selectedDeviceId === "")
          {
            message.textContent = "使用するカメラを選択してください";

            return;
          }
          
          cameraStream = 
            await navigator
              .mediaDevices
              .getUserMedia({
                video: {
                  deviceId: {
                    exact: selectedDeviceId
                  }
                },

                audio: false
              });

            video.srcObject = cameraStream;

            await video.play();

            message.textContent = "カメラを起動しました。";

        }
        catch(error)
        {
          console.error(
            "[StartCamera]", error);

          message.textContent = "カメラを起動できませんでした。\n" + "エラー名: " + error.name + "\n" + "詳細: " + error.message;
        }
      }

      function stopCamera()
      {
        if(cameraStream !== null)
        {
          cameraStream
            .getTracks()
            .forEach(
              function(track)
              {
                track.stop();
              }
            );

          cameraStream = null;

        }
      const video = document.getElementById("camera");

      video.srcObject = null;

      document.getElementById("message").textContent = "カメラは停止中です";

      }

    /* 
     * ぺージから離れる際もカメラを停止する。
     */

      window.addEventListener(
        "pagehide",
        stopCamera
      );

      async function loadCameras()
      {
        const message = document.getElementById("camera_select");

        try{
          const temporaryStream = 
            await navigator.mediaDevices
              .getUserMedia({
                video: true,
                audio: false
              });

          temporaryStream
            .getTracks()
            .forEach(function(track)
                     {
                       track.stop();
                     });

          const devices = await navigator.mediaDevices.enumerateDevices();

          const cameras = 
            devices.filter(function(device){
              {
                return device.kind === "videoinput";
              });

          cameraSelect.innerHTML = 
            '<option value="">'
            + 'カメラを選択してください'
            + '</option>';

          cameras.forEach(function(camera, index)
                          {
                            const option = document.createElement("option");

                            option.value = camera.deviceId;

                            option.textContent = camera.label || "カメラ " + (index + 1);

                            cameraSelect.appendChild(option);
                          });

          message.textContent = cameras.length + "台のカメラを検出しました。";
        }
        catch(error)
        {
          console.error(
            "[loadCameras]", 
            error
          );

          message.textContent = "カメラ一覧を取得できませんでした。\n"
          + error.name
          + ": "
          + error.message;
        ]   
      }
    </script>
  </body>
</html>

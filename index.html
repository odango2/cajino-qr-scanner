<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>1S QRコードスキャナー</title>

  <style>
    body {
      max-width: 700px;
      margin: 0 auto;
      padding: 16px;
      font-family: sans-serif;
      color: #222;
      background-color: #f5f5f5;
    }

    section {
      padding: 18px;
      border: 1px solid #ccc;
      border-radius: 12px;
      background-color: #fff;
    }

    button,
    select {
      width: 100%;
      max-width: 500px;
      min-height: 48px;
      margin: 6px 0;
      padding: 8px 12px;
      box-sizing: border-box;
      font-size: 16px;
    }

    button {
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.6;
    }

    #QR_QRcode_reader_camera_status,
    #QR_QRcode_reader_result,
    #QR_connection_status,
    #QR_send_status,
    #QR_script_status {
      min-height: 24px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-weight: bold;
    }

    #QR_connection_area {
      max-width: 500px;
      margin-bottom: 18px;
      padding: 12px;
      border: 1px solid #7b9fc8;
      border-radius: 8px;
      background-color: #f3f8ff;
      box-sizing: border-box;
    }

    #QR_QRcode_reader {
      width: 100%;
      max-width: 500px;
      min-height: 300px;
      margin-top: 12px;
      border: 2px solid #333;
      border-radius: 8px;
      box-sizing: border-box;
      overflow: hidden;
      background-color: #eee;
    }

    #QR_last_scan_area {
      display: none;
      max-width: 500px;
      margin-top: 16px;
      padding: 14px;
      border: 1px solid #6ea46e;
      border-radius: 8px;
      background-color: #effaef;
      box-sizing: border-box;
    }

    #QR_last_scan_id {
      font-size: 22px;
      letter-spacing: 2px;
    }

    .notice {
      max-width: 500px;
      padding: 12px;
      border-radius: 8px;
      background-color: #fff8d6;
      box-sizing: border-box;
      line-height: 1.6;
    }

    .connection-label {
      font-weight: bold;
    }

    .retry-button {
      display: none;
      background-color: #e8f1ff;
      font-weight: bold;
    }

    @media (max-width: 600px) {
      body {
        padding: 10px;
      }

      section {
        padding: 14px;
      }

      #QR_QRcode_reader {
        min-height: 260px;
      }
    }
  </style>
</head>

<body>
  <h1>1S QRコードスキャナー</h1>

  <section>
    <div id="QR_connection_area">
      <h2>PCとの接続</h2>

      <p id="QR_connection_status">
        接続情報を確認しています。
      </p>

      <p>
        <span class="connection-label">
          端末ID:
        </span>

        <span id="QR_station_id">
          未設定
        </span>
      </p>

      <p>
        <span class="connection-label">
          接続コード:
        </span>

        <span id="QR_pairing_code">
          未設定
        </span>
      </p>
    </div>

    <h2>QRコードリーダー</h2>

    <p class="notice">
      利用者のQRコードを読み取ってください。
      正しい形式のユーザーIDを読み取ると、
      operation画面へ送信します。
      QRを読み取っただけでは、
      コインの加算や減算は実行されません。
    </p>

    <p id="QR_script_status">
      QR機能を準備しています。
    </p>

    <button
      type="button"
      id="QR_script_retry_button"
      class="retry-button"
    >
      QR機能を再読み込み
    </button>

    <p id="QR_QRcode_reader_camera_status"></p>

      id="QR_QRcode_reader_camera_

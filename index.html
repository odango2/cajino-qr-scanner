<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Kajino-QRcode-ver10.0</title>

        <style>
            body {
            padding: 16px;
            font-family: sans-serif;
            }
             
            button {
            width: 100%;
            max-width: 500px;
            min-height: 48px;
            }
             
             
            #QR_QRcode_reader_camera_status {
            white-space: pre-wrap;
            }
             
            #QR_QRcode_reader_result {
            overflow-wrap: anywhere;
            }
            #QR_QRcode_reader {
            width: 100%;
            max-width: 500px;
            min-height: 300px;
            border: 2px solid black;
            box-sizing: border-box;
            overflow: hidden;
            }
        </style>
    </head>

    <body>
        <h1>1S QRコードスキャナー</h1>
        <section>
            <h3>QRコードリーダー</h3>
            <p id="QR_QRcode_reader_camera_status"></p>
            <select id="QR_QRcode_reader_camera_select">
                <option value="">カメラを選択してください</option>
            </select>
            <button id="QR_QRcode_reader_camera_reload_button" type="button">カメラ情報等を取得・更新</button>
            <button id="QR_QRcode_reader_button" type="button"></button>
            <p id="QR_QRcode_reader_result">読み取り結果：対象QRコードをかざしてください.</p>
            <div id="QR_QRcode_reader"></div>

            <!-- ライブラリ -->
            <script src='QR_QRcode_reader_Library.js'></script>
            <!-- JSファイル-->
            <script src='Kajino-QRcode-Reader.js'></script>
        </section>
    </body>
</html>

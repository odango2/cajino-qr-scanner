<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>1S QRコードスキャナー</title>

  <style>
    body {
      max-width: 700px;
      margin: 0 auto;
      padding: 16px;
      font-family: sans-serif;
      color: #222;
      background-color: #f5f5f5;
    }

    section {
      padding: 18px;
      border: 1px solid #ccc;
      border-radius: 12px;
      background-color: #fff;
    }

    button,
    select {
      width: 100%;
      max-width: 500px;
      min-height: 48px;
      margin: 6px 0;
      padding: 8px 12px;
      box-sizing: border-box;
      font-size: 16px;
    }

    button {
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.6;
    }

    #QR_QRcode_reader_camera_status,
    #QR_QRcode_reader_result,
    #QR_connection_status,
    #QR_send_status,
    #QR_script_status {
      min-height: 24px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-weight: bold;
    }

    #QR_connection_area {
      max-width: 500px;
      margin-bottom: 18px;
      padding: 12px;
      border: 1px solid #7b9fc8;
      border-radius: 8px;
      background-color: #f3f8ff;
      box-sizing: border-box;
    }

    #QR_QRcode_reader {
      width: 100%;
      max-width: 500px;
      min-height: 300px;
      margin-top: 12px;
      border: 2px solid #333;
      border-radius: 8px;
      box-sizing: border-box;
      overflow: hidden;
      background-color: #eee;
    }

    #QR_last_scan_area {
      display: none;
      max-width: 500px;
      margin-top: 16px;
      padding: 14px;
      border: 1px solid #6ea46e;
      border-radius: 8px;
      background-color: #effaef;
      box-sizing: border-box;
    }

    #QR_last_scan_id {
      font-size: 16px;
      letter-spacing: 1px;
      overflow-wrap: anywhere;
      word-break: break-all;
    }

    .notice {
      max-width: 500px;
      padding: 12px;
      border-radius: 8px;
      background-color: #fff8d6;
      box-sizing: border-box;
      line-height: 1.6;
    }

    .connection-label {
      font-weight: bold;
    }

    @media (max-width: 600px) {
      body {
        padding: 10px;
      }

      section {
        padding: 14px;
      }

      #QR_QRcode_reader {
        min-height: 260px;
      }
    }
  </style>
</head>

<body>
  <h1>1S QRコードスキャナー</h1>

  <section>
    <div id="QR_connection_area">
      <h2>PCとの接続</h2>

      <p id="QR_connection_status">
        接続情報を確認しています。
      </p>

      <p>
        <span class="connection-label">
          端末ID:
        </span>

        <span id="QR_station_id">
          未設定
        </span>
      </p>

      <p>
        <span class="connection-label">
          接続コード:
        </span>

        <span id="QR_pairing_code">
          未設定
        </span>
      </p>
    </div>

    <h2>QRコードリーダー</h2>

    <p
      id="QR_reader_notice"
      class="notice"
    >
      利用者のQRコードを読み取ってください。
      正しい形式のユーザーIDを読み取ると、
      operation画面へ送信します。
      QRを読み取っただけでは、
      コインの加算や減算は実行されません。
    </p>

    <p id="QR_script_status">
      QRライブラリを読み込んでいます。
    </p>

    <p id="QR_QRcode_reader_camera_status"></p>

    <select id="QR_QRcode_reader_camera_select">
      <option value="">
        カメラを選択してください
      </option>
    </select>

    <button
      id="QR_QRcode_reader_camera_reload_button"
      type="button"
      disabled
    >
      カメラ情報を取得・更新
    </button>

    <button
      id="QR_QRcode_reader_button"
      type="button"
      disabled
    >
      読み取り開始　＊カメラ停止中
    </button>

    <p id="QR_QRcode_reader_result">
      読み取り結果：対象QRコードをかざしてください。
    </p>

    <p id="QR_send_status"></p>

    <div id="QR_QRcode_reader"></div>

    <div id="QR_last_scan_area">
      <h3>最後に読み取ったQR</h3>

      <p>
        <strong id="QR_last_scan_id"></strong>
      </p>

      <button
        type="button"
        id="QR_resend_button"
        disabled
      >
        PCへ再送信
      </button>

      <button
        type="button"
        id="QR_reset_result_button"
      >
        読取結果を消去
      </button>
    </div>

    <iframe
      id="QR_send_frame"
      name="QR_send_frame"
      hidden
    ></iframe>

    <form
      id="QR_send_form"
      method="post"
      target="QR_send_frame"
      hidden
    >
      <input
        type="hidden"
        name="action"
        value="submitScan"
      >

      <input
        type="hidden"
        id="QR_send_session_id"
        name="sessionId"
      >

      <input
        type="hidden"
        id="QR_send_station_id"
        name="stationId"
      >

      <input
        type="hidden"
        id="QR_send_pairing_code"
        name="pairingCode"
      >

      <input
        type="hidden"
        id="QR_send_payload"
        name="payload"
      >

      <input
        type="hidden"
        id="QR_send_source"
        name="source"
      >
    </form>
  </section>

  <script>
    "use strict";

    function loadExternalScript(
      sourceUrl
    )
    {
      return new Promise(
        function(resolve, reject)
        {
          const script =
            document.createElement(
              "script"
            );

          script.src =
            sourceUrl;

          script.async =
            false;

          script.addEventListener(
            "load",
            function()
            {
              resolve(
                sourceUrl
              );
            }
          );

          script.addEventListener(
            "error",
            function()
            {
              reject(
                new Error(
                  "読み込めませんでした: "
                  + sourceUrl
                )
              );
            }
          );

          document.body.appendChild(
            script
          );
        }
      );
    }


    async function initializeQrScripts()
    {
      const statusArea =
        document.getElementById(
          "QR_script_status"
        );

      const startButton =
        document.getElementById(
          "QR_QRcode_reader_button"
        );

      const reloadButton =
        document.getElementById(
          "QR_QRcode_reader_camera_reload_button"
        );

      try
      {
        statusArea.textContent =
          "QRライブラリを読み込んでいます...";

        statusArea.style.color =
          "black";

        await loadExternalScript(
          "https://cdnjs.cloudflare.com/ajax/libs/"
          + "html5-qrcode/2.3.8/"
          + "html5-qrcode.min.js"
        );

        if(
          typeof Html5Qrcode
          === "undefined"
        )
        {
          throw new Error(
            "Html5Qrcodeが定義されませんでした。"
          );
        }

        statusArea.textContent =
          "QR制御JavaScriptを読み込んでいます...";

        await loadExternalScript(
          "./Kajino-QRcode-Reader.js?v=12"
        );

        if(
          typeof QR_loadConnection
          !== "function"
        )
        {
          throw new Error(
            "QR_loadConnectionが定義されませんでした。"
          );
        }

        statusArea.textContent =
          "JavaScriptを正常に読み込みました。";

        statusArea.style.color =
          "green";

        reloadButton.disabled =
          false;

        if(
          document
            .getElementById(
              "QR_QRcode_reader_camera_select"
            )
            .options.length
          > 1
        )
        {
          startButton.disabled =
            false;
        }
      }
      catch(error)
      {
        console.error(
          "[initializeQrScripts]",
          error
        );

        statusArea.textContent =
          "QR機能の読み込みに失敗しました。\n"
          + (
            error
            &&
            error.message
              ? error.message
              : String(error)
          );

        statusArea.style.color =
          "red";

        startButton.disabled =
          true;

        reloadButton.disabled =
          true;
      }
    }


    initializeQrScripts();
  </script>
</body>
</html>
